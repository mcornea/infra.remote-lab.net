services:
  jellyseer:
    image: ghcr.io/seerr-team/seerr:v3.5.1
    container_name: jellyseer
    user: root
    volumes:
      - /mnt/nfs/jellyseer/config:/app/config
    networks:
      infra-net:
        ipv4_address: 172.16.1.44
    devices:
      - nvidia.com/gpu=all
    security_opt:
      - label=disable
    restart: unless-stopped

networks:
  infra-net:
    external: true
    name: infra-net
