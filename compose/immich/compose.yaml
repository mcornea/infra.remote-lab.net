services:
  immich_postgres:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    container_name: immich_postgres
    volumes:
      - /mnt/nfs/immich/pgdata:/var/lib/postgresql/data
    env_file:
      - /mnt/nfs/immich/.env
    environment:
      DB_STORAGE_TYPE: "HDD"
    networks:
      - immich_internal
    restart: always

  immich_redis:
    image: docker.io/valkey/valkey:9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    container_name: immich_redis
    env_file:
      - /mnt/nfs/immich/.env
    networks:
      - immich_internal
    restart: always

  immich_server:
    image: ghcr.io/immich-app/immich-server:v3.3.5
    container_name: immich_server
    volumes:
      - /mnt/nfs/immich/library:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - /mnt/nfs/immich/.env
    networks:
      immich_internal: {}
      infra-net:
        ipv4_address: "172.16.1.33"
        mac_address: "5a:e4:b3:dc:bc:1b"
    restart: always
    devices:
      - "nvidia.com/gpu=all"
    security_opt:
      - label=disable

  immich_machine_learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.3.3
    container_name: immich-machine-learning
    volumes:
      - /mnt/nfs/immich/model-cache:/cache
    env_file:
      - /mnt/nfs/immich/.env
    networks:
      - immich_internal
    restart: always
    devices:
      - "nvidia.com/gpu=all"
    security_opt:
      - label=disable

networks:
  immich_internal:
    external: true
  infra-net:
    external: true
